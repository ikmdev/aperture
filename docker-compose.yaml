services:
  aperture:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aperture
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_API_KEY: ${APP_API_KEY:-your-default-dev-key}
      APP_DATABASE_DIRECTORY: /data
      SERVER_PORT: ${SERVER_PORT:-8080}
    volumes:
      - ${APP_DATA_HOST_DIR:-./data}:/data
    restart: unless-stopped
