#Application Configuration
app.api.key=${APP_API_KEY:your-default-dev-key}
app.database.directory=${APP_DATABASE_DIRECTORY:${user.dir}/target/data}

#Web Server Configuration
server.port=8080

# Set default log level
logging.level.root=info
# Set log level for your application package
logging.level.dev.ikm.aperture=debug
# Write logs to a file named 'aperture.log'
logging.file.name=aperture.log

# Alternatively, just specify a directory, and it will use 'spring.log'
# logging.file.path=/var/log/aperture